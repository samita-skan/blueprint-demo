<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Executive Summary · Skan AI Blueprint</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var query = new URLSearchParams(location.search).get("brand");
          var stored = localStorage.getItem("blueprint-brand-version");
          var brand =
            query === "original" || query === "skan-2026"
              ? query
              : stored === "original" || stored === "skan-2026"
                ? stored
                : "skan-2026";
          document.documentElement.setAttribute("data-brand", brand);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
